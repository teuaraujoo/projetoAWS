<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets//styles/libs/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
</head>

<body>
    <div id="container" class="p-3">

        <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home"
                    type="button" role="tab" aria-controls="pills-home" aria-selected="true">Cliente</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="pills-profile-tab" data-bs-toggle="pill" data-bs-target="#pills-profile"
                    type="button" role="tab" aria-controls="pills-profile" aria-selected="false">Produto</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="pills-contact-tab" data-bs-toggle="pill" data-bs-target="#pills-contact"
                    type="button" role="tab" aria-controls="pills-contact" aria-selected="false">Pedido</button>
            </li>
        </ul>
        <div class="tab-content" id="pills-tabContent">
            <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab"
                tabindex="0">
                <div>
                    <h1>Cliente</h1>
                    <input class="d-none" id="idCliente" />
                    <form class="row g-3">
                        <div class="col-md-6">
                            <label for="inputEmail4" class="form-label">Nome</label>
                            <input type="email" class="form-control" id="inputNome">
                        </div>
                        <div class="col-md-6">
                            <label for="inputPassword4" class="form-label">Email</label>
                            <input type="email" class="form-control" id="inputEmail">
                        </div>
                        <div class="col-12">
                            <label for="inputAddress" class="form-label">Telefone</label>
                            <input type="text" class="form-control" id="inputTel" placeholder="(99) 90000-9999">
                        </div>
                        <div class="col-12">
                            <label for="inputAddress2" class="form-label">Nascimento</label>
                            <input type="date" class="form-control" id="inputNasc"
                                placeholder="Apartment, studio, or floor">
                        </div>
                        <div class="col-md-4">
                            <label for="inputState" class="form-label">Sexo</label>
                            <select id="inputSexo" class="form-select">
                                <option selected>Choose...</option>
                                <option>M</option>
                                <option>F</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <button type="button" id="btnSalvarCliente" class="btn btn-primary">Salvar</button>
                        </div>
                    </form>
                    <table class="table mt-5">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Nome</th>
                                <th scope="col">Email</th>
                                <th scope="col">Telefone</th>
                                <th scope="col">Nascimento</th>
                                <th scope="col">Sexo</th>
                                <th scope="col">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tableClientes">

                        </tbody>
                    </table>
                </div>
            </div>
            <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab"
                tabindex="0">
                <div>
                    <h1>Produto</h1>
                    <input class="d-none" id="idProduto">
                    <div>
                        <form class="row g-3">
                            <div class="col-md-6">
                                <label for="inputEmail4" class="form-label">Nome</label>
                                <input type="email" class="form-control" id="inputNomeProduto">
                            </div>
                            <div class="col-md-6">
                                <label for="inputPassword4" class="form-label">Preço</label>
                                <input type="number" class="form-control" id="inputPreco">
                            </div>
                            <div class="col-12">
                                <label for="inputAddress" class="form-label">Descrição</label>
                                <input type="text" class="form-control" id="inputDescricao"
                                    placeholder="Digite a descrição">
                            </div>
                            <div class="col-12">
                                <label for="inputAddress2" class="form-label">Estoque</label>
                                <input type="number" class="form-control" id="inputEstoque"
                                    placeholder="Quantidade no estoque">
                            </div>
                            <div class="col-12">
                                <button type="button" id="btnSalvarProduto" class="btn btn-primary">Salvar</button>
                            </div>
                        </form>
                        <table class="table mt-5">
                            <thead>
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">Nome</th>
                                    <th scope="col">Preço</th>
                                    <th scope="col">Estoque</th>
                                </tr>
                            </thead>
                            <tbody>

                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="tab-pane fade" id="pills-contact" role="tabpanel" aria-labelledby="pills-contact-tab"
                    tabindex="0">
                    <div>
                        <h1>Pedido</h1>
                        <div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="./assets/script/libs/bootstrap.bundle.min.js"></script>
        <script type="module" src="./assets/script/main.js"></script>
</body>

</html>
